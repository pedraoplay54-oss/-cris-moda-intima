<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Cris Moda Íntima</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{marsala:'#6B122C'}}}}</script></head><body class="bg-[#FAFAFA] text-[#2B2B2B]"><header class="bg-white border-b"><div class="max-w-5xl mx-auto px-5 h-20 flex items-center justify-between"><b class="text-2xl text-marsala">Cris Moda Íntima</b><a href="index.html" class="text-sm">Voltar à loja</a></div></header><main class="max-w-5xl mx-auto px-5 py-10 grid lg:grid-cols-3 gap-7"><form id="checkoutForm" class="lg:col-span-2 bg-white p-7 space-y-5"><h1 class="text-2xl font-semibold">Finalizar pedido</h1><p class="text-sm text-gray-500">Preencha seus dados. O pedido será enviado pelo WhatsApp para confirmação.</p><input name="name" required class="w-full border p-3" placeholder="Nome completo"><input name="email" type="email" class="w-full border p-3" placeholder="E-mail"><input name="cep" required class="w-full border p-3" placeholder="CEP"><select name="payment" class="w-full border p-3"><option>PIX</option><option>Cartão de crédito</option></select><button class="w-full bg-marsala text-white py-4 font-semibold">Enviar pedido pelo WhatsApp</button></form><aside class="bg-white p-7"><h2 class="font-semibold">Resumo</h2><div id="checkoutItems" class="mt-3"></div><div class="border-t mt-5 pt-5 flex justify-between"><span>Total</span><b id="checkoutTotal">R$ 0,00</b></div></aside></main><div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#2B2B2B] text-white px-5 py-3 rounded-full hidden"></div><script src="app.js"></script></body></html>
